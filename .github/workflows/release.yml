name: Publish NuttyMod Client release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/build.py
      - name: Publish matching client assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="$(python -c "import runpy; print('v' + runpy.run_path('tools/build.py')['VERSION'])")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$release_tag" ]; then
            echo 'Release tag must match the client version.' >&2
            exit 1
          fi
          if gh release view "$release_tag" > /dev/null 2>&1; then
            echo "Release $release_tag already exists; leaving it unchanged."
          else
            gh release create "$release_tag" downloads/NuttyMod-Client-1.0.0.tar downloads/NuttyMod-Client-1.0.0.zip downloads/SHA256SUMS.txt --target "$GITHUB_SHA" --title "NuttyMod Client $release_tag" --notes-file docs/RELEASE_NOTES.md
          fi
